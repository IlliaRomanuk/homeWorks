<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green shop</title>
    <link rel="icon" href="./images/Vector.png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="stylesheet" href="./css/reset.css">
</head>
<body>
        <div  class="popup">
           <div class="popup_content">
            <img class="crossImage" src="./images/X.png" alt="">
                <div class="container">
                    <div class="main_logo">
                        <p>Login</p>
                        <p>|</p>
                        <p class="different_color">Register</p>
                    </div>
                    <form class="form" action="">
                        <legend>Enter your email and password to register.</legend>
                        <label for="">
                            <input class="pole-voda" type="text" placeholder="Username" required>
                        </label>
                        <label for="">
                            <input class="pole-voda" type="email"  placeholder="Enter your email address" required>
                        </label>
                        <div class="input-container">
                            <label for=""><input class="pole-voda" type="password" placeholder="Password" required></label>
                            <img src="./images/Hide.png" alt="" class="eye-icon">
                        </div>
                        <label for=""><input class="pole-voda" placeholder="Confirm Password" type="password" required></label>
                        <button class="submit" type="submit">Register</button>
                    </form>
                    <div class="register_social">
                        <div class="text-with-line">
                            <p class="line">-</p>
                            <p>Or register with</p>
                            <p class="line">-</p>
                        </div>
                        <button class="btn-social"><img src="./images/google 1.png" alt="">Continue with Google</button>
                        <button class="btn-social"><img src="./images/facebook 1.png" alt="">Continue with Facebook</button>
                    </div>
                </div>
                 <div class="footer"></div> 
            </div>
        </div>
</body>
</html>
